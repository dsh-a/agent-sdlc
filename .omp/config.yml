# omp project settings — agent-sdlc (omp + OpenRouter target)
#
# This is the omp HARNESS settings layer. The framework's agent-readable runtime
# config (model tiers, project commands, architecture rules, context sources)
# lives in .omp/agent-config.md — agents read it by path at runtime.
#
# Model tier → concrete model resolution:
#   1. Copy .omp/models.yml.sample → ~/.omp/agent/models.yml
#   2. Uncomment ONE OpenRouter model per tier (opus/sonnet/haiku)
#   3. Uncomment its equivalence.override line so the canonical id below resolves
#   4. Set OPENROUTER_API_KEY in your env or <repo>/.env

modelRoles:
  default: claude-sonnet-4-5   # sonnet tier — implementation agents
  smol:    claude-haiku-4-5    # haiku tier  — monitor / preflight / supervisor
  slow:    claude-opus-4-6     # opus tier   — orchestrator (/cycle), verify, review
  task:    claude-sonnet-4-5   # spawned task subagents default to sonnet tier

modelProviderOrder:
  - openrouter
  - anthropic

# OpenRouter variant — global speed/availability preference.
# nitro: fastest (good for haiku tier — latency-sensitive monitor/preflight)
# floor: cheapest (cost optimization for lightweight agents)
# online: highest availability (avoid rate limits during parallel Phase-3 waves)
# exacto: exact model match (no provider fallback — strictest quality)
# default: standard routing
providers:
  openrouterVariant: default

# Auto-approve workspace writes + bash so the cycle pipeline runs autonomously.
# Narrow to tools.approval.bash: prompt if you want per-command gating.
tools:
  approvalMode: write
  approval:
    bash: allow

# Native task isolation — omp creates an isolated workspace per spawn
# (baseline captured from the current HEAD = feature branch), runs the agent,
# commits to a task branch, and cherry-picks into the parent. This replaces
# the framework's manual git worktree protocol. Branch-mode merge so each
# agent's commits land on the feature branch.
task:
  isolation:
    mode: auto
  mergeMode: branch
  maxConcurrency: 4           # max parallel Phase-3 agents (tune to your CPU/budget)
  maxRecursionDepth: 2       # agent spawning agent depth (implementer -> setup-scaffold)
  agentIdleTtlMs: 600000     # 10 min — keep finished agents alive for irc follow-ups

compaction:
  strategy: snapcompact
  thresholdPercent: -1
  midTurnEnabled: true       # check thresholds between tool-loop requests (long Phase-3)

lsp:
  enabled: true
  lazy: true
  diagnosticsOnWrite: true

skills:
  enableSkillCommands: true

# Autolearn — after an agent stops, omp nudges it to capture lessons to memory
# and create/enhance managed skills. Feeds the self-improve agent's work across
# cycles. Passive by default (reminder rides the next turn, no extra tokens).
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 5

# Advisor — second model reviews each orchestrator turn and can inject advice.
# Catches planning mistakes, missed AC, scope drift. Uses the smol tier (cheap).
# Enable per-session with --advisor or /advisor on.
advisor:
  enabled: false              # opt-in; enable when orchestrator context gets long
  subagents: false
  syncBacklog: off
  immuneTurns: 3

# Memory — cross-cycle learning. 'local' persists lessons to ~/.omp/agent/memory.
# Feeds the orchestrator's context on resume and the self-improve agent.
memory:
  backend: local

# Retry + model fallback — OpenRouter models rate-limit or go down.
# modelFallback falls back to another available model when one is unavailable.
retry:
  enabled: true
  maxRetries: 5
  modelFallback: true

# Context promotion — overflow recovery for small-context models.
# Promotes to a larger-context sibling before falling back to compaction.
contextPromotion:
  enabled: true

# Thinking budgets — token budgets per thinking level (used by agent thinkingLevel).
thinkingBudgets:
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768

# Status line — show cycle phase from the todo tool in the TUI.
# The 'full' preset shows model + cwd + git branch; add todo phase via custom segments.
statusLine:
  preset: full
thinkingBudgets:
  low: 2048
  medium: 8192
  high: 16384
  xhigh: 32768

# Subagent service tier — inherit tracks the main agent's tier.
tier:
  subagent: inherit
